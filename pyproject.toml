[project]
name = "clinic-tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[project.scripts]
clinic = "clinic.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: ошибки и предупреждения PEP 8
    "F",        # pyflakes: неиспользуемые импорты и переменные
    "I",        # isort: порядок импортов
    "N",        # pep8-naming: имена
    "UP",       # pyupgrade: устаревший синтаксис
    "B",        # bugbear: типичные ошибки (в т.ч. изменяемые аргументы по умолчанию)
    "SIM",      # упрощение кода
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]